var F=[[["There is one true God, the Creator of heaven and earth and of all living things. He has revealed Himself to humanity as Father in creation, through His Son Jesus Christ in redemption, and as the Holy Spirit in regeneration and indwelling presence.", "We believe that Jesus Christ is God manifested in the flesh. He was conceived by the Holy Spirit, born of the virgin Mary, lived a sinless life, died for our sins, was buried, and bodily rose from the dead on the third day. He ascended into heaven and lives in all believers through the indwelling presence of the Holy Spirit."], "Deuteronomy 6:4; Isaiah 9:6; Matthew 1:18-23; John 1:1-14; John 10:30; Colossians 2:9; 1 Timothy 3:16."], [["The Bible is the inspired and infallible Word of God. It is the authoritative revelation of God's character, will, and redemptive plan for humanity. The Scriptures provide the foundation for Christian faith, doctrine, conduct, and ministry."], "Psalm 119:105; John 17:17; 2 Timothy 3:16-17; 2 Peter 1:20-21."], [["Salvation is the gift of God, provided by His mercy and grace through the atoning death and resurrection of Jesus Christ. Salvation cannot be earned through human effort but is received through faith in Jesus Christ.", "We believe that all people are called to repent of their sins, believe in the Lord Jesus Christ, be baptized in water in obedience to His command, and receive the transforming and indwelling presence of the Holy Spirit. Through Christ, believers receive forgiveness of sins, new life, and the hope of eternal salvation."], "Matthew 28:19; Mark 16:16; John 3:3-5; Acts 2:38; Romans 6:3-4; Ephesians 2:8-9; 2 Peter 3:9."], [["The Church consists of all who believe in the Lord Jesus Christ, have been redeemed through His blood, and have been born again by the Holy Spirit. Jesus Christ is the Head of the Church, and believers are united as members of His body.", "A local church is a community of Christian believers who assemble for worship, prayer, fellowship, biblical instruction, ministry, and the proclamation of the Gospel.", "We affirm the spiritual authority, self-governance, and autonomy of every local church. We respect and honor the distinctive identity, calling, and ministry expression that God has entrusted to each congregation."], "Matthew 16:18; Acts 2:42-47; 1 Corinthians 12:12-27; Ephesians 1:22-23; Ephesians 4:4-6; Colossians 1:18."], [["We believe in the personal and bodily return of the Lord Jesus Christ. We believe in the resurrection and catching away of believers to be with the Lord forever. The return of Christ is the blessed hope of the Church and calls every believer to live faithfully, prayerfully, and expectantly."], "John 14:1-3; Acts 1:9-11; 1 Corinthians 15:51-52; 1 Thessalonians 4:16-18; Titus 2:13."], [["We believe that the family is established by God for human companionship, spiritual nurture, well-being, and the continuation of humanity. We believe that God designed marriage as a sacred covenant between one man and one woman. Christian marriage should reflect faithfulness, mutual love, honor, commitment, and the relationship between Christ and His Church."], "Genesis 1:27-28; Genesis 2:18-24; Matthew 19:4-6; Ephesians 5:21-33; Hebrews 13:4."], [["We believe in the spiritual unity of all believers in the Lord Jesus Christ. Jesus commanded His followers to love one another and prayed that they would be one.", "Our common faith in Jesus Christ creates a spiritual bond that unites us, even as we recognize and respectfully navigate differences in traditions, practices, ministry expressions, and secondary doctrinal matters. We seek unity that is grounded in biblical truth, expressed through love, and strengthened through mutual honor."], "Psalm 133:1; John 13:34-35; John 17:20-23; Romans 12:4-5; Ephesians 4:1-6."], [["We believe that God has the power to heal physical, emotional, and spiritual infirmities. The Scriptures encourage believers to pray for the sick in faith and to trust in the compassion, wisdom, and sovereign will of God.", "We believe that the Holy Spirit imparts gifts of healing according to His will. Healing comes from the Lord, not from human ability, and all glory belongs to Him."], "Isaiah 53:4-5; Matthew 8:16-17; 1 Corinthians 12:7-11; James 5:14-16; 1 Peter 2:24."], [["We believe in observing the Lord's Supper in remembrance of the sacrificial death of Jesus Christ. Through the bread and the fruit of the vine, believers proclaim the Lord's death, remember His covenant, examine their hearts, and anticipate His return."], "Luke 22:14-20; 1 Corinthians 10:16-17; 1 Corinthians 11:23-26."], [["We believe that God calls both men and women to serve Him and His Church. He equips His servants through the Holy Spirit and imparts spiritual gifts, anointing, wisdom, and favor so they may proclaim the Gospel, disciple believers, serve His people, and advance His Kingdom. We believe that the ministry gifts described in Ephesians 4, including apostles, prophets, evangelists, pastors, and teachers, remain relevant to the Church for the equipping of believers, the work of ministry, and the building up of the body of Christ.", "Kingdom Alliance International is committed to connecting, empowering, commissioning, encouraging, and strengthening those whom God has called to serve and lead His people."], "Numbers 11:29; Joel 2:28-29; Acts 2:17-18; Romans 12:4-8; 1 Corinthians 12:4-11; Ephesians 4:11-13; 1 Peter 4:10-11."]];
var FES=[[["Hay un solo Dios verdadero, Creador de los cielos y de la tierra y de todos los seres vivientes. Él se ha revelado a la humanidad como Padre en la creación, mediante su Hijo Jesucristo en la redención, y como Espíritu Santo en la regeneración y en su presencia que habita en el creyente.", "Creemos que Jesucristo es Dios manifestado en carne. Fue concebido por el Espíritu Santo, nació de la virgen María, vivió una vida sin pecado, murió por nuestros pecados, fue sepultado y resucitó corporalmente al tercer día. Ascendió al cielo y vive en todos los creyentes por la presencia del Espíritu Santo que mora en ellos."], "Deuteronomio 6:4; Isaías 9:6; Mateo 1:18-23; Juan 1:1-14; Juan 10:30; Colosenses 2:9; 1 Timoteo 3:16."], [["La Biblia es la Palabra de Dios, inspirada e infalible. Es la revelación con autoridad del carácter de Dios, de su voluntad y de su plan redentor para la humanidad. Las Escrituras son el fundamento de la fe, la doctrina, la conducta y el ministerio cristianos."], "Salmo 119:105; Juan 17:17; 2 Timoteo 3:16-17; 2 Pedro 1:20-21."], [["La salvación es un regalo de Dios, provisto por su misericordia y su gracia mediante la muerte expiatoria y la resurrección de Jesucristo. La salvación no se puede ganar con esfuerzo humano, sino que se recibe por la fe en Jesucristo.", "Creemos que todas las personas son llamadas a arrepentirse de sus pecados, creer en el Señor Jesucristo, ser bautizadas en agua en obediencia a su mandato y recibir la presencia transformadora del Espíritu Santo que mora en ellas. Por medio de Cristo, los creyentes reciben el perdón de los pecados, una vida nueva y la esperanza de la salvación eterna."], "Mateo 28:19; Marcos 16:16; Juan 3:3-5; Hechos 2:38; Romanos 6:3-4; Efesios 2:8-9; 2 Pedro 3:9."], [["La Iglesia está formada por todos los que creen en el Señor Jesucristo, han sido redimidos por su sangre y han nacido de nuevo por el Espíritu Santo. Jesucristo es la Cabeza de la Iglesia, y los creyentes están unidos como miembros de su cuerpo.", "Una iglesia local es una comunidad de creyentes cristianos que se congregan para la adoración, la oración, la comunión, la instrucción bíblica, el ministerio y la proclamación del Evangelio.", "Afirmamos la autoridad espiritual, el autogobierno y la autonomía de cada iglesia local. Respetamos y honramos la identidad, el llamado y la expresión ministerial particulares que Dios ha confiado a cada congregación."], "Mateo 16:18; Hechos 2:42-47; 1 Corintios 12:12-27; Efesios 1:22-23; Efesios 4:4-6; Colosenses 1:18."], [["Creemos en el regreso personal y corporal del Señor Jesucristo. Creemos en la resurrección y el arrebatamiento de los creyentes para estar con el Señor para siempre. El regreso de Cristo es la bendita esperanza de la Iglesia y llama a cada creyente a vivir con fidelidad, oración y expectación."], "Juan 14:1-3; Hechos 1:9-11; 1 Corintios 15:51-52; 1 Tesalonicenses 4:16-18; Tito 2:13."], [["Creemos que la familia fue establecida por Dios para la compañía humana, la formación espiritual, el bienestar y la continuidad de la humanidad. Creemos que Dios diseñó el matrimonio como un pacto sagrado entre un hombre y una mujer. El matrimonio cristiano debe reflejar fidelidad, amor mutuo, honra, compromiso y la relación entre Cristo y su Iglesia."], "Génesis 1:27-28; Génesis 2:18-24; Mateo 19:4-6; Efesios 5:21-33; Hebreos 13:4."], [["Creemos en la unidad espiritual de todos los creyentes en el Señor Jesucristo. Jesús mandó a sus seguidores que se amaran unos a otros y oró para que fueran uno.", "Nuestra fe común en Jesucristo crea un vínculo espiritual que nos une, aun cuando reconocemos y manejamos con respeto las diferencias en tradiciones, prácticas, expresiones ministeriales y asuntos doctrinales secundarios. Buscamos una unidad fundada en la verdad bíblica, expresada mediante el amor y fortalecida por la honra mutua."], "Salmo 133:1; Juan 13:34-35; Juan 17:20-23; Romanos 12:4-5; Efesios 4:1-6."], [["Creemos que Dios tiene poder para sanar las enfermedades físicas, emocionales y espirituales. Las Escrituras animan a los creyentes a orar con fe por los enfermos y a confiar en la compasión, la sabiduría y la voluntad soberana de Dios.", "Creemos que el Espíritu Santo concede dones de sanidad según su voluntad. La sanidad viene del Señor, no de la capacidad humana, y toda la gloria le pertenece a Él."], "Isaías 53:4-5; Mateo 8:16-17; 1 Corintios 12:7-11; Santiago 5:14-16; 1 Pedro 2:24."], [["Creemos en celebrar la Cena del Señor en memoria de la muerte sacrificial de Jesucristo. Mediante el pan y el fruto de la vid, los creyentes proclaman la muerte del Señor, recuerdan su pacto, examinan su corazón y anticipan su regreso."], "Lucas 22:14-20; 1 Corintios 10:16-17; 1 Corintios 11:23-26."], [["Creemos que Dios llama tanto a hombres como a mujeres a servirle a Él y a su Iglesia. Él equipa a sus siervos por medio del Espíritu Santo y les concede dones espirituales, unción, sabiduría y favor para que proclamen el Evangelio, discipulen a los creyentes, sirvan a su pueblo y extiendan su Reino. Creemos que los dones ministeriales descritos en Efesios 4, entre ellos apóstoles, profetas, evangelistas, pastores y maestros, siguen vigentes en la Iglesia para el perfeccionamiento de los creyentes, la obra del ministerio y la edificación del cuerpo de Cristo.", "Kingdom Alliance International está comprometida a conectar, empoderar, comisionar, animar y fortalecer a quienes Dios ha llamado a servir y a dirigir a su pueblo."], "Números 11:29; Joel 2:28-29; Hechos 2:17-18; Romanos 12:4-8; 1 Corintios 12:4-11; Efesios 4:11-13; 1 Pedro 4:10-11."]];
